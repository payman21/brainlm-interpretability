name: brainlm
type: foundation_model
code_path: models/foundation/brainlm/src
checkpoint_path: models/foundation/brainlm/checkpoints/old_13M
notes: >
  Masked-autoencoder foundation model pretrained on 6,700 h of fMRI (UK Biobank + HCP).
  old_13M is the checkpoint matching the preprint's section 3.3 exactly: 512-dim, 4-layer /
  4-head encoder, 2-layer decoder, 424 parcels x 200 timepoints in 20-step patches. The
  vitmae_111M / vitmae_650M checkpoints are later unpublished successors, are stock ViTMAE
  with no xyz embeddings, and cannot take this input. See
  docs/neurips_workshop_paper_plan.md section 8.1.3.

input:
  # Fixed 2026-08-15 by a reconstruction-R2 sweep, label-free, and frozen thereafter.
  # The .npy files are robust-scaled to median 0 / IQR 1, which is ~40x below the
  # amplitude BrainLM was pretrained at. This gain restores the operating point.
  # docs/neurips_workshop_paper_plan.md section 8.1.2; docs/analysis_plan_frozen.md section 1.
  gain: 7.0
  coordinates: external/atlases/A424/A424_Coordinates.dat
  coordinate_units: mm          # raw MNI mm beat min-max [0,1] in the same sweep
  window: 200                   # timepoints, taken from the centre of the run
  window_position: centre

embedding:
  # mask_ratio 0 => nothing is masked, so the encoder sees every token and the
  # embedding is deterministic. The checkpoint's own 0.2 is a pretraining setting
  # and would make frozen embeddings depend on a random draw.
  mask_ratio: 0.0
  pool: [cls, mean]             # CLS token (index 0) and mean over parcel tokens

  # REQUIRED. BrainLM's encoder is order-sensitive (Nystromformer landmarks are
  # segment means over consecutive tokens) and its masking path randomly permutes
  # all 4,240 tokens on every call, even at mask_ratio 0. Without a fixed order the
  # same subject and window give a different embedding each call (3.0% median
  # relative spread on cls). See identity_noise() in the extraction scripts.
  token_order: identity
